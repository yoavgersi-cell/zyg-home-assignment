<!doctype html><html><head><meta charset="utf-8"><style>
  *{box-sizing:border-box;margin:0;padding:0;}
  :root{
    --navy:#0A2540;
    --blue:#3E63DD;
    --muted:#667085;
    --faint:#8A97A8;
    --line:#E6EAF0;
    --bg:#FAFBFC;
  }
  body{width:1600px;height:900px;background:var(--bg);position:relative;overflow:hidden;
       font-family:'Helvetica Neue',Arial,'Liberation Sans',sans-serif;
       -webkit-font-smoothing:antialiased;}

  .center{position:absolute;inset:0;display:flex;flex-direction:column;
          align-items:center;justify-content:center;text-align:center;padding:0 160px;}

  .eyebrow{font-size:14px;font-weight:700;color:var(--blue);letter-spacing:3px;text-transform:uppercase;}
  .title{margin-top:26px;font-size:60px;font-weight:700;color:var(--navy);letter-spacing:-1.2px;
         line-height:1.12;max-width:1240px;}
  .assign{margin-top:24px;font-size:24px;font-weight:400;color:var(--muted);letter-spacing:.2px;}
  .tag{margin-top:22px;font-size:19px;font-weight:400;color:var(--faint);letter-spacing:.1px;max-width:820px;line-height:1.5;}

  .divider{margin-top:52px;width:44px;height:2px;background:#DCE2EC;border-radius:2px;}

  .by-label{margin-top:44px;font-size:13px;font-weight:700;color:var(--muted);
            letter-spacing:2.4px;text-transform:uppercase;}
  .by-name{margin-top:12px;font-size:23px;font-weight:700;color:var(--navy);letter-spacing:-.2px;}
  .by-date{margin-top:8px;font-size:15px;font-weight:500;color:var(--faint);letter-spacing:.3px;}

  /* persistent branding */
  .logo{position:absolute;bottom:30px;opacity:.65;}
  .logo.zyg{left:32px;font-weight:800;font-size:26px;color:#FF4A00;letter-spacing:-1px;}
  .logo.stripes{right:32px;text-align:right;line-height:1;}
  .logo.stripes .word{font-family:Georgia,'Times New Roman',serif;font-weight:700;font-size:24px;color:#111;letter-spacing:.3px;}
  .logo.stripes .beauty{font-size:11px;font-weight:700;letter-spacing:5px;color:#111;margin-top:2px;}
</style></head><body>

  <div class="center">
    <div class="eyebrow">Part 1 &middot; Home Assignment</div>
    <div class="title">E-commerce Product &amp; CRO Manager</div>
    <div class="assign">Home Assignment</div>
    <div class="tag">Product thinking, CRO strategy and launch execution for Stripes Beauty.</div>
    <div class="divider"></div>
    <div class="by-label">Prepared by</div>
    <div class="by-name">Yoav Gersi</div>
    <div class="by-date">August 2026</div>
  </div>

  <div class="logo zyg">ZyG</div>
  <div class="logo stripes"><div class="word">Stripes</div><div class="beauty">BEAUTY</div></div>

</body></html>
